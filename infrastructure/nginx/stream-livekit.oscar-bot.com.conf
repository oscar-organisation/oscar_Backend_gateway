server {
    listen 80;
    server_name stream-livekit.oscar-bot.com;

    # Validation Certbot (renouvellement automatique)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection HTTP vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name stream-livekit.oscar-bot.com;

    # Certificats SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/stream-livekit.oscar-bot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream-livekit.oscar-bot.com/privkey.pem;

    # Parametres SSL securises
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Resolver Docker pour la resolution dynamique des noms de conteneurs
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Reverse proxy vers le serveur LiveKit (signaling WebSocket)
    location / {
        set $upstream http://oscar-livekit-server:7880;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
