services:
  edge:
    # L'image vient du registre, designee par son empreinte. La reference est
    # posee par le paquet dans /etc/oscar/release.env : c'est la release qui
    # sait quelle image lui correspond, pas l'operateur.
    image: ${OSCAR_EDGE_IMAGE:?OSCAR_EDGE_IMAGE absent - paquet installe ?}
    container_name: oscar-edge
    network_mode: host
    ipc: host
    restart: unless-stopped
    env_file:
      # Profil materiel du chassis, puis configuration issue du bundle publie.
      # L'ordre compte : le bundle decide de ce qui tourne, le profil de la
      # maniere dont cela se branche.
      - /etc/oscar/robot.env
      - /etc/oscar/bundle.env
    volumes:
      - /etc/oscar/credentials:/run/secrets/oscar:ro
    # Le runtime n'a besoin d'aucun peripherique : la camera et la carte
    # moteur appartiennent au conteneur chassis.
    stop_grace_period: 25s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  # Pilotes du constructeur et arret de securite. L'image est celle livree avec
  # le robot (ROBOT_BASE_IMAGE dans robot.env) : jamais tiree, jamais modifiee,
  # jamais redistribuee. Seuls deux fichiers de la release y sont montes.
  chassis:
    image: ${ROBOT_BASE_IMAGE:?ROBOT_BASE_IMAGE absent de robot.env}
    pull_policy: never
    container_name: oscar-chassis
    network_mode: host
    ipc: host
    restart: unless-stopped
    env_file:
      - /etc/oscar/robot.env
      - /etc/oscar/bundle.env
    entrypoint: ["/opt/oscar-chassis/chassis.sh"]
    volumes:
      - ./docker/chassis.sh:/opt/oscar-chassis/chassis.sh:ro
      - ./runtime/arret_securite.py:/opt/oscar-chassis/arret_securite.py:ro
      - ./docker/healthcheck-chassis.sh:/opt/oscar-chassis/healthcheck.sh:ro
      # Camera et peripheriques USB du chassis.
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rmw"
    healthcheck:
      test: ["CMD", "/opt/oscar-chassis/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 3
    # Un ros2 launch eteint ses noeuds un par un : cinq secondes ne suffisaient
    # pas, et Docker tuait le conteneur en plein arret.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  # Pont micro-ROS vers la carte de commande du chassis. Service a part : il
  # tourne avec l'image du constructeur et a besoin des peripheriques bruts,
  # ce qu'on ne donne pas au runtime OSCAR. Active par le profil, via
  # COMPOSE_PROFILES=microros.
  microros:
    image: ${OSCAR_MICROROS_IMAGE:-oscar/microros:absent}
    container_name: oscar-microros
    profiles: ["microros"]
    network_mode: host
    restart: unless-stopped
    privileged: true
    environment:
      # Pas de transport force ici : la carte de commande publie par la pile
      # DDS par defaut, et lui imposer UDPv4 seul la rendait invisible des
      # abonnes. Le partage de /dev/shm sert cette meme decouverte.
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
    command: ${OSCAR_MICROROS_ARGS:-serial --dev /dev/ttyUSB0 -b 2000000}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"
