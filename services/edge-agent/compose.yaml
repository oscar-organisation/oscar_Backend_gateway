services:
  edge:
    # L'image vient du registre, jamais d'une construction locale. La reference
    # est posee par le paquet dans /etc/oscar/release.env : c'est la release qui
    # sait quelle image lui correspond, pas l'operateur.
    image: ${OSCAR_EDGE_IMAGE:?OSCAR_EDGE_IMAGE absent - paquet installe ?}
    container_name: oscar-edge
    network_mode: host
    ipc: host
    restart: unless-stopped
    env_file:
      # Profil materiel du chassis, puis configuration issue du bundle publie.
      # L'ordre compte : le bundle decide de ce qui tourne, le profil de la
      # maniere dont cela se branche.
      - /etc/oscar/robot.env
      - /etc/oscar/bundle.env
    volumes:
      - /etc/oscar/credentials:/run/secrets/oscar:ro
      # Camera et peripheriques USB du chassis : le runtime met lui-meme les
      # pilotes en route sur un robot sorti de carton.
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rmw"
    # Cinq secondes ne suffisaient pas : la mise en route lance des ros2 launch
    # qui eteignent leurs noeuds un par un. Docker tuait donc le conteneur en
    # plein arret, ou le laissait a moitie vivant assez longtemps pour que la
    # relance suivante croie qu'il tournait encore.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  # Pont micro-ROS vers la carte de commande du chassis. Service a part : il
  # tourne avec l'image du constructeur et a besoin des peripheriques bruts,
  # ce qu'on ne donne pas au runtime OSCAR. Active par le profil, via
  # COMPOSE_PROFILES=microros.
  microros:
    image: ${OSCAR_MICROROS_IMAGE:-oscar/microros:absent}
    container_name: oscar-microros
    profiles: ["microros"]
    network_mode: host
    restart: unless-stopped
    privileged: true
    environment:
      # Pas de transport force ici : la carte de commande publie par la pile
      # DDS par defaut, et lui imposer UDPv4 seul la rendait invisible des
      # abonnes. Le partage de /dev/shm sert cette meme decouverte.
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
    command: ${OSCAR_MICROROS_ARGS:-serial --dev /dev/ttyUSB0 -b 2000000}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"
